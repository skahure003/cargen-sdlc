version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    groups:
      django-runtime:
        patterns:
          - "Django"
          - "gunicorn"
          - "whitenoise"
          - "dj-database-url"
      database:
        patterns:
          - "psycopg*"
      tooling:
        patterns:
          - "python-dotenv"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Nairobi"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
